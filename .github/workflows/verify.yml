# The pipeline. Story 1.10 — see planning/epic-01-application-foundation/story-10-*.
#
# THE VERIFICATION STEP IS `pnpm verify` AND NOTHING ELSE. Not
# `pnpm build && pnpm lint && ...`, not a matrix of one job per step, not a
# "faster" reordering. Story 1.1 built that chain to be the single acceptance
# command precisely so CI and a developer's machine cannot disagree about what
# green means; re-listing the tools here forks that definition, which is the
# specific failure this story exists to prevent. The payoff has already happened
# three times: `stories` (Task 1.4.5) and `env:check` (Task 1.6.6) both reached
# CI without a workflow existing to update, and `test:process` (Task 1.10.5)
# reached it with this file open and untouched — a seventh step, in the split
# below, for no workflow edit at all. If a later task cannot be done without
# changing what `pnpm verify` means, the change belongs in the chain.
#
# Per-step visibility is bought by reading the chain's OWN output rather than by
# forking it: pnpm announces each step as a `$ pnpm run <name>` line, every line
# is stamped with milliseconds since the step started, and the summary at the
# end is derived from those announcements. Nothing here knows the step names.
#
# `pnpm verify` half-covers this file, and the half it covers is the one people
# assume it does not: Prettier ships a YAML parser and `prettier --check .`
# reaches .github/workflows/ — measured, not assumed, by making it fail. ESLint
# sees only JS and TS, so nothing checks the *schema*: a misspelled key, a job
# that references an action that does not exist, or a `runs-on` label GitHub
# retires are all green locally and red only on the runner. That is a narrower
# gap than the four already recorded (apps/backend/scripts/dev.sh, the two
# `rm -rf` fragments in `clean` scripts, the unenforced-invariant class, and
# README.md's prose figures) and it is new as of 2026-09-03. Task 1.10.7 re-dates
# the set; do not let it read as "CI checks its own definition".
# Named for the command it runs, not for the category it belongs to. `CI` is
# generic and anything containing "tests" or "coverage" would be dishonest: the
# chain is seven steps of which `test` is one — `test:process` is a seventh,
# added by Task 1.10.5 and picked up here with no edit to this file, which is
# the third time the argument at the top has paid — and coverage is deliberately
# not gated. This name and the job name below are settled here rather than in Task
# 1.10.6, because a badge and a required status check are both keyed on them and
# a rename silently un-requires a check.
#
# THE FILE NAME IS PART OF THE PUBLIC INTERFACE NOW. Task 1.10.6 renamed this
# file from `ci.yml` to `verify.yml` so the three identifiers agree, and it did
# so BEFORE publishing the badge, because a badge URL is keyed on the FILE name
# (`/actions/workflows/verify.yml/badge.svg`) while a required status check is
# keyed on the JOB name. The two are independent and both are silent when
# broken. The badge endpoint has THREE states and all three were measured
# anonymously rather than assumed. A file GitHub has never seen answers
# `404 text/plain`, which is a broken image in README.md. A file that exists but
# has no run on the tracked branch answers `200` with a `verify - no status`
# badge. And the dangerous one: the OLD path keeps answering `200` with
# `verify - passing` after the file is gone, serving the last conclusion it ever
# had — so a badge left pointing at a renamed file does not break, it FREEZES
# GREEN. Renaming this file means editing the badge URL in README.md in the same
# commit, and the reason is not that the badge would go red. The badge's own
# label comes from `name:` above rather than from the file, which is why it read
# `verify - passing` for four tasks while the file was still `ci.yml`.
name: verify

# `push` is restricted to `main`; every other branch is verified through its
# pull request. A pull request from a branch in this repository fires BOTH
# events, so a bare `push:` beside `pull_request:` runs the whole chain twice
# for one change and the answer arrives from whichever finishes first. The
# restriction is the better half of that trade for a second reason: a
# `pull_request` run verifies the merge commit (`refs/pull/N/merge`), which is
# what would land on `main`, while a push run verifies the branch tip, which is
# not. The cost is that a branch with no pull request open is not verified —
# `workflow_dispatch` covers that case deliberately, and it is also what made
# Task 1.10.1's second cold-install reading possible without an empty commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Three pushes in a minute otherwise means three full chains and the answer
# arrives from the wrong one. `main` is exempt on purpose: a run there is the
# record of what that commit does, and a cancelled run leaves a commit on the
# default branch with no verdict against it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This job reads the repository and nothing else.
permissions:
  contents: read

jobs:
  verify:
    # The check name a required status check would be keyed on. Settled here,
    # with the workflow name above; Task 1.10.6 points a badge at it.
    name: verify
    # GitHub's own image, on the floating label rather than a pinned one: a
    # pinned image ages out of support and fails hard, and this is not
    # third-party code with the repository checked out. The two actions below
    # are, and they are pinned differently for exactly that reason.
    runs-on: ubuntu-latest
    steps:
      # Both actions are pinned to a commit SHA rather than a major tag. A tag
      # is mutable and these run with the repository checked out; this is the
      # same position `allowBuilds` takes one layer down, and taking a looser
      # one here would need an argument. The cost is a manual bump: a SHA does
      # not follow security releases, so read the release notes when bumping.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node comes from .nvmrc, never from a literal here. `engines` plus
      # `engineStrict` makes pnpm refuse a different major outright, so a wrong
      # Node is a hard install failure rather than a warning — the good case,
      # and it was made to happen once rather than assumed.
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # pnpm comes from package.json's `packageManager` field. There is
      # deliberately no pnpm install step and no pnpm action: the pin is the
      # point, and a workflow that installs 11.24.0 by hand is a second place
      # the version lives. Corepack runs after setup-node so the shims land in
      # the Node that setup-node put on the PATH.
      #
      # This ordering is why the store cache below is an explicit
      # `actions/cache` step: actions/setup-node's own `cache: pnpm` needs pnpm
      # on the PATH *before* setup-node runs, which is the usual reason people
      # reach for a separate pnpm install action. Task 1.10.3 kept the ordering
      # and the pin and paid a third pinned action for it; the argument is
      # written out beside the cache step.
      - name: Enable Corepack
        run: corepack enable

      - name: Record the toolchain
        run: |
          set -euo pipefail
          node_expected="v$(tr -d '[:space:]' < .nvmrc)"
          node_actual="$(node --version)"
          pnpm_expected="$(node -p "require('./package.json').packageManager.split('@').pop().split('+')[0]")"
          pnpm_actual="$(pnpm --version)"
          echo "node: $node_actual   (.nvmrc pins $node_expected)"
          echo "pnpm: $pnpm_actual   (packageManager pins $pnpm_expected)"
          echo "runner: $(uname -srm)"
          [ "$node_actual" = "$node_expected" ] || { echo "::error::Node is $node_actual, .nvmrc pins $node_expected"; exit 1; }
          [ "$pnpm_actual" = "$pnpm_expected" ] || { echo "::error::pnpm is $pnpm_actual, packageManager pins $pnpm_expected"; exit 1; }

      # ------------------------------------------------------------------
      # The STORE is cached. `node_modules` is not, and neither is any build
      # output — see the two rules below, both of which are measurements rather
      # than caution.
      #
      # WHY THE STORE AND NOT node_modules: a cold install from an empty store
      # is dominated by fetching, and linking is what pnpm is fast at (Task
      # 1.1.8). A restored `node_modules` is additionally a tree that was linked
      # against a different store and a different lockfile, which is a class of
      # failure with no error message.
      #
      # WHY NOTHING UNDER dist/, storybook-static/ OR ANY .tsbuildinfo IS
      # CACHED, EVER: `packages/shared` is consumed as built output, and Story
      # 1.9 measured what a STALE `packages/shared/dist` does — 13 failing
      # backend tests whose messages name nothing about staleness. `tsc -b`
      # decides what to rebuild from `.tsbuildinfo`, so a restored build state
      # is a runner that may skip work the commit needed; and `tsc -b --clean`
      # deletes the output of the sources that CURRENTLY exist, so a restored
      # `dist/` can carry orphaned files from a branch where a source was
      # deleted. The whole value of this pipeline is that it builds from
      # nothing. Task 1.10.2 measured what that costs: running the chain twice
      # in one job, the second with `dist/`, `storybook-static/` and the
      # `.tsbuildinfo` files present, moved exactly ONE step — `build`, 6,010 ->
      # 3,477 ms — while lint, Prettier, both checks and Vitest were unchanged,
      # because they start from nothing either way. So the entire prize for
      # caching the build is ~2.5 s against a 9 s runner-to-runner spread. It is
      # not a correctness risk taken for speed; it is a correctness risk taken
      # for a saving smaller than the measurement noise.
      #
      # ORDERING: `corepack enable` stays after `actions/setup-node` so the
      # shims land in the Node setup-node installed, which means setup-node's
      # own `cache: pnpm` cannot see pnpm at the moment it runs. This explicit
      # cache step is what that ordering costs: a third pinned action. The
      # alternative — moving Corepack before setup-node — keeps one action and
      # pins pnpm to whatever Node the runner image happens to ship until
      # setup-node replaces it, which is a second, invisible toolchain for the
      # length of one step. Not worth it. Do not reach for an action that
      # INSTALLS pnpm: `packageManager` is the pin and that is the point.
      - name: Resolve the pnpm store path
        id: store
        run: |
          set -euo pipefail
          # From pnpm, never a literal. The location is pnpm's business and it
          # has moved before; on this runner it has been
          # /home/runner/.local/share/pnpm/store/v11, which is a cross-check on
          # what this prints and not a value to hardcode.
          path="$(pnpm store path)"
          echo "pnpm store path: $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          # The Node major belongs in the key because the store can hold
          # packages built for a runtime. It comes from the Node that is
          # actually on the PATH, which the step above has already asserted
          # equals .nvmrc.
          echo "node-major=$(node -p 'process.versions.node.split(".")[0]')" >> "$GITHUB_OUTPUT"

      # Keyed on the lockfile hash, the runner OS and the Node major. The OS
      # component is not a formality: Task 1.10.1 measured 397 packages on Linux
      # against 398 on macOS from the same lockfile, and the one package is
      # fsevents@2.3.3 (os: [darwin], optional, via Vite). A store restored
      # across operating systems is a store missing — or carrying — a package
      # the other side never wanted.
      #
      # The restore-key drops the lockfile hash, so a changed dependency starts
      # from the previous store rather than from nothing. `--frozen-lockfile`
      # still decides what a partial store is allowed to become.
      #
      # SCOPE, which is the trap: a cache saved by a `pull_request` run lives
      # in that pull request's scope and a `workflow_dispatch` run on the same
      # branch CANNOT see it — measured, `Cache not found` on the dispatched run
      # immediately after the pull request run reported `Cache saved`. So Task
      # 1.10.2's note that `workflow_dispatch` covers a branch with no pull
      # request open does not extend to measuring this cache: a warm reading has
      # to come from a re-run of the pull request run itself.
      #
      # TO BUST THIS CACHE BY HAND: bump `v1` in both the key and the
      # restore-key below. That is the one-line edit; there is no other
      # procedure and no button that is better.
      - name: Cache the pnpm store
        id: store-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-node${{ steps.store.outputs.node-major }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-node${{ steps.store.outputs.node-major }}-

      # --frozen-lockfile is CI's default and is asserted rather than relied on:
      # a runner that silently updates the lockfile is a runner testing a
      # different dependency tree from the one in the repository. Made to fail
      # once, with a hand-edited lockfile, before being trusted.
      - name: Install
        run: |
          set -euo pipefail
          # The pass/fail evidence for the cache is CATEGORICAL and lives here,
          # not in the wall clock: Task 1.10.2 measured a 9 s spread between two
          # runners on identical work, which is larger than the whole install a
          # cache could remove — so a timing delta from one run against one run
          # cannot tell a working cache from a lucky runner, and these two
          # facts can.
          #
          # `cache-hit` is the ONLY output `actions/cache` declares, and it is
          # `true` on an exact key match and `false` on both a restore-key match
          # and a total miss. `cache-matched-key` belongs to `actions/cache/restore`
          # and reads as the empty string here — read out of the action's own
          # action.yml after a run printed nothing three times, so do not put it
          # back. What separates the two `false` cases is the line below it:
          # pnpm's own `reused`/`downloaded` counts. A restore-key hit reads
          # `reused 397, downloaded 2`; a genuine miss reads `reused 0,
          # downloaded 397`.
          echo "cache-hit (exact key): ${{ steps.store-cache.outputs.cache-hit }}"
          echo "read the reused/downloaded counts below to tell a restore-key hit from a miss"
          start=$(date +%s%N)
          pnpm install --frozen-lockfile
          end=$(date +%s%N)
          echo "install: $(( (end - start) / 1000000 )) ms"
          # Not `--trust-lockfile`. That flag skips pnpm 11's supply-chain
          # verification, which is the single dominant line in a cold install
          # here (492 entries in 2.5-5.2 s) and the one thing a store cache
          # structurally cannot remove, because it verifies the LOCKFILE rather
          # than the store. It is tempting for exactly that reason and it is
          # wrong here: a pull request may change the lockfile, and this runner
          # is the machine that is supposed to check it. Its own documentation
          # says "use only when the lockfile is part of the trusted base".

      # This repository's first platform-specific native binding. Rolldown
      # resolves @rolldown/binding-darwin-arm64 on the development machine and
      # something else here; the lockfile records all fifteen variants as
      # optional dependencies. Read the installed one by name rather than
      # inferring it from a green install — if the first pipeline failure in
      # this repository's history is an install or a `vite build` that has never
      # failed locally, this is the first place to look.
      - name: Confirm the Rolldown binding by name
        run: |
          set -euo pipefail
          bindings="$(ls node_modules/.pnpm | grep '^@rolldown+binding-' || true)"
          echo "installed rolldown bindings:"
          echo "${bindings:-<none>}"
          [ "$(printf '%s\n' "$bindings" | grep -c .)" -eq 1 ] || { echo "::error::expected exactly one rolldown binding"; exit 1; }
          case "$bindings" in
            @rolldown+binding-linux-x64-gnu@*) ;;
            *) echo "::error::unexpected rolldown binding: $bindings"; exit 1 ;;
          esac
          find "node_modules/.pnpm/$bindings" -name '*.node' -printf '%p  %s bytes\n'

      # allowBuilds has exactly one entry and it has to run here: esbuild is the
      # only package in the installed tree with an install script, and that
      # script fetches a platform binary — so this is the first place it fetches
      # a different one. Running the binary is the test; a skipped install
      # script leaves a shim that cannot answer.
      - name: Confirm esbuild's install script ran
        run: |
          set -euo pipefail
          ls node_modules/.pnpm | grep -E '^(esbuild@|@esbuild\+)'
          esbuild_bin="$(printf '%s' node_modules/.pnpm/esbuild@*/node_modules/esbuild/bin/esbuild)"
          echo "esbuild binary: $esbuild_bin"
          "$esbuild_bin" --version

      # The acceptance command, by name, once. `pnpm run` waits for the script
      # and propagates the child's exit code at any nesting depth — measured in
      # Tasks 1.2.5 and 1.2.6 — and the chain is `&&`-joined, so the first
      # failure is the exit code and it reaches the runner intact. That is the
      # one claim this whole story leans on, and it is confirmed here rather
      # than cited from a laptop.
      #
      # The chain orders `build` before `test` and that ordering is load-bearing:
      # `packages/shared` is consumed as built output, so a workflow that runs
      # `pnpm test` on its own reports a partial pass (16 backend tests, which
      # import nothing shared) with `dist` missing, and 13 silent failures with
      # `dist` stale. Nothing here runs a chain step on its own, and nothing
      # here caches `dist/`, `storybook-static/` or any `.tsbuildinfo` — the
      # rule and its measured price are beside the cache step above.
      #
      # Nothing here starts a server. `pnpm ready` is not a step and must not
      # become one: `verify` runs with no servers up, where "nothing is running"
      # is the honest answer rather than a failure. `pnpm coverage` is not a step
      # here either; Task 1.10.4 owns it as a separate, non-gating one.
      #
      # THE JOB SUMMARY HAS THREE SECTIONS AND THEIR ORDER IS THE STEP ORDER,
      # which is deliberate rather than incidental (Task 1.10.6). What the tick
      # certifies comes first: the per-step split below IS the chain, so a
      # reader who opens a run meets the thing the badge is a claim about. The
      # frontend fingerprint is second, because it is a record of what the run
      # produced. Coverage is last, because it is the only section the tick does
      # not certify, and a figure that gates nothing should not be the first
      # number a reader sees under a green tick. Anything added later goes after
      # the split and before coverage, or after coverage; nothing goes above it.
      - name: Verify
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          start=$(date +%s%N)
          status=0
          pnpm verify 2>&1 | while IFS= read -r line; do
            printf '[%6d ms] %s\n' "$(( ($(date +%s%N) - start) / 1000000 ))" "$line"
          done | tee "$tmp/verify.log" || status=$?
          total=$(( ($(date +%s%N) - start) / 1000000 ))

          # The split is DERIVED, never declared. The step names come out of the
          # chain's own first line (`$ pnpm run build && pnpm run lint && ...`)
          # and the boundaries are the timestamps of the root-level `$ ` lines
          # pnpm prints as each one starts — the first of which is `verify`
          # announcing itself and is dropped. So this block knows no step names,
          # and a step added to `verify` appears here without an edit. On a
          # failure the chain stops, the stamps run out, and the last name
          # printed is the step it died in.
          sed -n '1s/.*\$ //p' "$tmp/verify.log" \
            | tr '&' '\n' \
            | sed -nE 's/.*pnpm run ([a-z:]+).*/\1/p' > "$tmp/names"
          grep -E '^\[[[:space:]]*[0-9]+ ms\] \$ ' "$tmp/verify.log" \
            | sed -E 's/^\[[[:space:]]*([0-9]+) ms\].*/\1/' \
            | tail -n +2 > "$tmp/stamps"

          paste "$tmp/names" "$tmp/stamps" | awk -v total="$total" '
            $2 == "" { exit }
            NR > 1   { printf "%s\t%d\n", pname, $2 - pt }
                     { pname = $1; pt = $2 }
            END      { if (pname != "") printf "%s\t%d\n", pname, total - pt }
          ' > "$tmp/split"

          echo
          echo "per-step split (derived from pnpm's own output):"
          awk -F'\t' '{ printf "  %-13s %6d ms\n", $1, $2 }' "$tmp/split"
          echo "  ------------------------"
          printf '  %-13s %6d ms\n' TOTAL "$total"

          # The same split, into the job summary. This is a REDIRECT of output
          # that already exists, not a second report: it reads $tmp/split, which
          # the derivation above produced from pnpm's own announcements, so a
          # step added to `verify` appears here for no edit — as `test:process`
          # did in Task 1.10.5, in a run where this file was not touched. A
          # summary that hand-listed the steps, or wrote a step count into a
          # sentence, would be the fork this whole workflow exists to prevent
          # wearing a nicer typeface. There is no count here for that reason.
          #
          # The spread note beside it is not decoration. Two runners measured
          # 31,075 ms and 21,989 ms on the same commit (Task 1.10.2) and nine
          # runs of one tree spanned 18,589-32,210 ms (Task 1.10.3), both on the
          # six-step chain; the seven-step chain's first reading was 43,263 ms.
          # Without that sentence a reviewer reads a normal run as a regression,
          # and blames the cache for a slow one.
          {
            if [ "$status" -eq 0 ]; then
              echo "### \`pnpm verify\` — passed in ${total} ms"
            else
              echo "### \`pnpm verify\` — FAILED (exit ${status}) after ${total} ms"
              echo
              echo "The chain stops at the first failure, so the last step below is"
              echo "the one it died in and the steps after it did not run."
            fi
            echo
            echo "| Step | Duration |"
            echo "| --- | ---: |"
            awk -F'\t' '{ printf "| `%s` | %s ms |\n", $1, $2 }' "$tmp/split"
            printf '| **total** | **%s ms** |\n' "$total"
            echo
            echo "Step names are read out of pnpm's own announcement lines, so this"
            echo "table is whatever \`pnpm verify\` currently chains — nothing here"
            echo "lists the steps."
            echo
            echo "Runner-to-runner spread on identical work is larger than anything"
            echo "in this table: 31,075 ms against 21,989 ms for one commit on two"
            echo "runners, and 18,589-32,210 ms over nine runs of one tree. **Do not"
            echo "read a single total as a regression.**"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # ------------------------------------------------------------------
      # The frontend artefact's fingerprint, printed rather than uploaded —
      # and that is Task 1.10.4's decision on `apps/frontend/dist/`, not an
      # omission.
      #
      # The candidate was an upload: three files, 343,658 B of JavaScript and
      # 10,926 B of CSS, md5 `cba2825c...`, byte-identical from a clean clone
      # for five stories running. Cheap to upload — and an upload does not
      # actually answer the question anyone asks of it. "The artefact did not
      # move" is currently re-measured by hand at every story close, and
      # downloading two zips from two runs to diff them is the same manual
      # comparison with more steps in front of it. A fingerprint in the job
      # summary is the comparison: it is greppable across runs in the GitHub UI
      # without downloading anything, and it costs no storage and no retention
      # decision.
      #
      # It walks whatever `dist/` holds rather than naming the three files, so
      # a fourth file appears here on its own. That happened one story later:
      # Task 1.11.4 added `staticwebapp.config.json` — Azure Static Web Apps
      # wants its configuration at the root of the deployed output — and this
      # step needed no edit, taking the artefact to four files and 355,985 B.
      # This is deliberately NOT a check:
      # nothing asserts the hash, because the artefact is supposed to change
      # when the frontend changes and a pinned hash would be a check that fails
      # for the right reason. It is a record.
      - name: Fingerprint the frontend artefact
        run: |
          set -euo pipefail
          dist=apps/frontend/dist
          {
            echo "### Frontend artefact"
            echo
            # THIS IS NOT THE DEPLOYED ARTEFACT, and saying so here is the
            # cheaper half of Task 1.11.6's answer to it. `VITE_API_BASE_URL` is
            # substituted into the bundle at build time and this chain does not
            # set it, so what this table describes is a bundle dialling
            # http://localhost:3000. Task 1.11.5 measured the gap at 72 bytes
            # and one string literal (344,537 B / 3c886f88... here, against
            # 344,609 B / 7654c2e0... deployed). The deploy workflow builds WITH
            # the variable and prints that build's fingerprint, which is the
            # table to compare against production.
            echo "Built without \`VITE_API_BASE_URL\`, so this is **not** the deployed"
            echo "artefact — see the deploy workflow's summary for that one."
            echo
            echo "| File | Bytes | md5 |"
            echo "| --- | ---: | --- |"
            find "$dist" -type f | sort | while IFS= read -r f; do
              printf '| `%s` | %s | `%s` |\n' \
                "${f#"$dist"/}" "$(stat -c %s "$f")" "$(md5sum "$f" | cut -d' ' -f1)"
            done
            find "$dist" -type f -printf '%s\n' \
              | awk '{ n++; b += $1 } END { printf "\n%d files, %d bytes total.\n", n, b }'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # COVERAGE. Read the three decisions before editing this step.
      #
      # 1. IT RUNS OUTSIDE `verify`, AND IT IS A STEP IN THIS JOB RATHER THAN A
      #    SECOND JOB. Story 1.9 kept `pnpm coverage` out of the chain
      #    deliberately — nothing gates on the number, and instrumenting every
      #    run costs every developer for a figure nobody reads — and that
      #    decision is unchanged here. Where it goes was measured rather than
      #    assumed. A second JOB is a second runner: its own checkout, its own
      #    setup-node, its own Corepack, its own cache restore, its own install
      #    (3,895-4,597 ms on a cache hit) and then, unavoidably, its own
      #    `pnpm build` — because `packages/shared` is consumed as built output
      #    and Story 1.9 measured what `pnpm test` does without one (16 passed
      #    with `dist` missing, 13 SILENT failures with it stale). `build` is
      #    the most expensive step on this runner at 5,204-8,527 ms. So a
      #    parallel coverage job is a near-duplicate of this one minus lint and
      #    Prettier, it costs roughly a whole second job in runner minutes, and
      #    it must not close that gap by caching `dist/` — the rule and the
      #    number that decides it are beside the cache step above.
      #
      #    As a step here it reuses the build `verify` just did and costs only
      #    the coverage run itself: 2.60-3.06 s locally (n=3), against a runner
      #    measured at 2.2-3.5x the laptop per step. That lengthens the answer
      #    everyone waits for by less than two runners already differ by — the
      #    chain totals over seven runs of one tree were 18,589 / 18,612 /
      #    24,450 / 24,568 / 24,693 / 31,274 / 32,210 ms, a 13.6 s spread on
      #    identical work.
      #
      #    A second WORKFLOW was never a candidate. The triggers and the
      #    concurrency group are properties of the workflow, so a second file
      #    duplicates both — a second place the trigger set lives and a second
      #    concurrency group that does not cancel with this one. That is the
      #    forking failure this story exists to prevent, one level up from the
      #    chain.
      #
      # 2. IT CANNOT FAIL THIS JOB, AND THAT IS THE POINT RATHER THAN A
      #    CONCESSION. `continue-on-error` is what keeps "the green tick
      #    certifies 113 tests and not coverage" structurally true instead of
      #    documented: no coverage outcome can turn the tick red, so no reader
      #    can infer coverage from it. README.md and CLAUDE.md both make that
      #    claim, and Story 1.1 spent three documents warning about a green tick
      #    that means less than it looks like, back when `test` was an `echo`.
      #    Both halves were made to happen rather than assumed, by temporarily
      #    adding `src/index.ts` to the backend's `coverage.exclude` on a throwaway
      #    commit — which is exactly the violation the assertion below exists for.
      #    The backend went 64.33% -> 91.08%, which is the flattering number the
      #    threshold argument predicts, the assertion fired with a named error,
      #    and the RUN CONCLUSION WAS STILL `success`. That is the decision
      #    working.
      #
      #    HOW A FAILURE HERE ACTUALLY SHOWS, because the obvious answer is
      #    wrong: the run carries two `failure` annotations — this step's own
      #    `::error::` naming the file, and `Process completed with exit code 1`
      #    — and THAT is the visible evidence. The step's `conclusion` reads
      #    `success` in the API and the UI, because `continue-on-error` swallows
      #    it; the real result is in `steps.<id>.outcome`, which this step has no
      #    id for and nothing reads. So do not look for a marked step, and do not
      #    write a later step's `if:` against this one's `conclusion` — it is
      #    `success` whatever happened.
      #
      # 3. THERE IS NO THRESHOLD. This is the first story that could set one and
      #    it declines, in writing rather than by omission. The baseline is
      #    30.00% / 64.33% / 68.25% of statements for `packages/shared`,
      #    `apps/backend` and `apps/frontend` — three separate reports, never
      #    one merged number, because the three packages share no code and
      #    Vitest configures coverage per package with no root config. Three
      #    reasons, in order of weight:
      #
      #      - A minimum over nine components, one route table, one
      #        configuration module and no application state is a number
      #        invented before there is anything to hold it to, and the cheapest
      #        way to meet it is to test what is easy. That makes the figure
      #        worse as a description of the suite while making it larger.
      #      - The denominator is about to move for a real reason. Task 1.10.5
      #        makes the backend's process half reachable, and 64.33% is a
      #        figure about a tree where it is not. A threshold set now would be
      #        set against a stale denominator, and re-set a task later — which
      #        is a threshold that tracks the number rather than constraining
      #        it.
      #      - The obvious way to meet any threshold here is to exclude the two
      #        0% entrypoints, and a threshold met that way measures less than
      #        no threshold at all. Hence the assertion below.
      #
      #    The reversal trigger is a number somebody would actually defend —
      #    which means after Task 1.10.5, against a denominator that includes
      #    the process half, and per package rather than globally.
      #
      # A coverage-reporting service is deliberately not used: a third-party
      # uploader is a token, a second definition of the number and an external
      # dependency for a repository whose whole coverage story is three local
      # HTML reports. The reversal trigger is a reviewer needing per-PR diff
      # coverage.
      - name: Coverage (reported, never gating)
        continue-on-error: true
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          pnpm coverage 2>&1 | tee "$tmp/coverage.log"

          # Derived from the command's own output, exactly as the per-step split
          # above is: `pnpm -r` prefixes every line with the package directory
          # it came from, so the packages in this table are the packages that
          # ran. Nothing here carries a hand-written list that can drift from
          # them — a fourth package appears on its own, and a package whose
          # `coverage` script disappears stops appearing.
          {
            echo "### Coverage — reported, gates nothing"
            echo
            echo "The green tick on this job certifies \`pnpm verify\` — the chain in"
            echo "the table above, whatever it currently contains. It does **not**"
            echo "certify these figures, and there is no threshold — see the workflow."
            echo "This step is \`continue-on-error\`, so no coverage outcome can turn"
            echo "the tick red, and its \`conclusion\` reads \`success\` however it exited."
            echo
            echo "| Package | % Stmts | % Branch | % Funcs | % Lines |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            grep -E '^[^ ]+ coverage: All files' "$tmp/coverage.log" \
              | awk -F'|' '
                  { split($1, a, " ")
                    for (i = 2; i <= 5; i++) gsub(/ /, "", $i)
                    printf "| `%s` | %s%% | %s%% | %s%% | %s%% |\n", a[1], $2, $3, $4, $5 }
                '
            echo
            echo "The terminal table in the log lists only files that are **not** fully"
            echo "covered, so it is not the denominator. \`<package>/coverage/index.html\`"
            echo "is, and it is in the uploaded artefact."
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # The one thing this step asserts, and it is not a percentage.
          #
          # `apps/backend/src/index.ts` and `apps/frontend/src/main.tsx` are the
          # process and the mount. No runner here reaches either, and both are
          # deliberately left IN the denominator so the hole is visible as a
          # figure rather than as a caveat — excluding them would take two
          # packages to a flattering number that describes less. That is a
          # stated invariant, and CLAUDE.md's third class of `verify` gap is
          # exactly the stated invariant that quietly stops being enforced, so
          # it is checked here rather than asserted in prose.
          #
          # It checks PRESENCE in the report and not a percentage of 0, on
          # purpose: Task 1.10.5 is expected to make the backend's process half
          # reachable, and an assertion pinned to 0% would fail for the right
          # reason on the task that fixes it.
          missing=0
          for page in apps/backend/coverage/src/index.ts.html \
                      apps/frontend/coverage/src/main.tsx.html; do
            if [ -f "$page" ]; then
              echo "in the denominator: $page"
            else
              echo "::error::$page is missing — the entrypoint has left the coverage denominator"
              missing=1
            fi
          done
          exit "$missing"

      # The three `coverage/` directories, and nothing else.
      #
      # SIZE, measured: 956 KB across 73 files, 218 KB zipped. Useful on a run
      # somebody is investigating, near-useless on a green one — which is why
      # the retention is 7 days rather than the 90-day default. A coverage
      # report is read within days of the run that produced it or it is not read
      # at all, and 90 days of a per-push artefact is real storage for a
      # portfolio repository.
      #
      # DECLINED, and recorded as declined rather than omitted:
      #
      #   - `apps/frontend/storybook-static/` — 299 modules, 59 files, 9.3 MB on
      #     disk, produced by `pnpm build` on every run whether anyone wants it
      #     or not. 9.3 MB per push, for a bundle nothing downstream consumes
      #     and no user is ever shown. Publishing it AS A SITE is a different
      #     question and belongs to Story 1.11; this is the upload question and
      #     the answer is no.
      #   - `apps/frontend/dist/` — three files, 352 KB. Declined in favour of
      #     the fingerprint step above, which answers the question an upload
      #     would be downloaded to answer.
      #   - `node_modules`, the store, and any build state — see the cache step.
      #
      # `if-no-files-found: error`, so a report that stops being produced is
      # loud here rather than silently uploading an empty artefact. This step
      # runs only when the coverage step above ran, which runs only when
      # `verify` passed: coverage of a tree that does not build is not a report
      # worth keeping.
      - name: Upload the coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/shared/coverage
            apps/backend/coverage
            apps/frontend/coverage
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # The browser suite. Story 1.13, Task 1.13.4.
  # ===========================================================================
  #
  # WHY THIS IS A SECOND JOB HERE AND NOT A `verify` STEP, AND NOT A SEPARATE
  # WORKFLOW. Story 1.10's founding rule is that the pipeline runs `pnpm verify`
  # BY NAME and defines nothing of its own, and `stories`, `env:check` and
  # `test:process` all arrived in the chain rather than in this file for that
  # reason. This is the first check with a real reason not to be in the chain,
  # so the three shapes were weighed rather than one of them assumed.
  #
  #   1. A `verify` STEP. Rejected, and this is the load-bearing rejection.
  #      `pnpm verify` runs with NOTHING LISTENING — that is why `pnpm ready` is
  #      not a step, and it is a property eight clean-clone runs have measured
  #      rather than an aspiration. A chain that needs two ports free stops
  #      being runnable from a cold tree, on a laptop with a dev server already
  #      up, and inside this job. The cost of keeping it out is real and is the
  #      whole reason this comment exists: the browser suite is a check CI runs
  #      that `pnpm verify` does not, which is the fork Story 1.10 spent eight
  #      tasks preventing. What keeps it honest is that this job invokes
  #      `pnpm build`, `pnpm dev` and `pnpm e2e` BY NAME and defines no browser
  #      command, no port and no readiness rule of its own — the same line
  #      `deploy.yml` holds for a deploy.
  #   2. A SEPARATE WORKFLOW, which is what `deploy.yml` is. Rejected, because
  #      all three of that file's reasons are properties of a DEPLOY rather than
  #      of a second job, and two of them argue the other way here. The badge:
  #      `deploy.yml` is separate so a registry outage cannot turn the tick red
  #      for something README.md says it does not certify — but a browser
  #      journey going red IS a claim about this commit, and the badge should
  #      report it. Concurrency: a cancelled deploy is a half-done rollout and
  #      needs a queue of its own; a cancelled browser run is a cancelled check,
  #      which is exactly what `verify`'s per-ref group already does correctly.
  #      Only the third reason survives, and it is answered below.
  #   3. A SECOND JOB IN THIS FILE. Taken. It inherits the triggers, the
  #      concurrency group and the badge, and it is a second runner rather than
  #      a second definition of anything.
  #
  # IT RUNS IN PARALLEL WITH `verify` AND DELIBERATELY DOES NOT `needs:` IT.
  # The two answer different questions — a green chain says nothing about
  # whether the two halves talk across the origin boundary, which is the failure
  # this whole story exists to catch — and serialising them would add the
  # chain's ~40 s to a job that already takes ~2 min for feedback that is not
  # better. The price is that a commit which fails to compile fails twice, in
  # two places, which is legible rather than confusing because the jobs are
  # named for what they check.
  #
  # IT GATES A MERGE, AND THAT SENTENCE IS THE ONLY DURABLE RECORD OF IT.
  # Repository ruleset `main` (id 22160620) is where required status checks
  # live, it is invisible in a diff, and Task 1.13.4 added `e2e` to it beside
  # `verify` — so a future reader finding only `verify` required should read
  # that as the gate having been REMOVED rather than never set. The argument is
  # the one that separates this from coverage: coverage is non-gating because
  # nobody can say which number is right, whereas this is a pass/fail assertion
  # about the product working in a browser, and a check nothing gates on is a
  # check nobody reads. It has zero retries here as it does locally, for the
  # reason every failure in this repository is made to happen rather than
  # retried away: a retry is how a suite stops being able to tell a flake from
  # a defect. If this gate starts flaking, that is information and the answer is
  # to fix the flake, not to add a retry.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve the pnpm store path
        id: store
        run: |
          set -euo pipefail
          path="$(pnpm store path)"
          echo "pnpm store path: $path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "node-major=$(node -p 'process.versions.node.split(".")[0]')" >> "$GITHUB_OUTPUT"

      # RESTORE and never SAVE, which is the one difference from the `verify`
      # job's step and it is deliberate. Both jobs run from the same commit and
      # the same lockfile, so they would compute the same key; two `actions/cache`
      # steps racing to save it is a "Cache already exists" warning on whichever
      # loses, which reads like a fault and is not one. The `verify` job owns
      # saving this cache. The consequence, stated rather than discovered: on the
      # first run after a lockfile change this job installs cold, because the
      # save it would have used has not happened yet.
      - name: Restore the pnpm store
        id: store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-v1-${{ runner.os }}-node${{ steps.store.outputs.node-major }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-v1-${{ runner.os }}-node${{ steps.store.outputs.node-major }}-

      - name: Install
        run: |
          set -euo pipefail
          echo "cache-hit (exact key): ${{ steps.store-cache.outputs.cache-hit }}"
          start=$(date +%s%N)
          pnpm install --frozen-lockfile
          end=$(date +%s%N)
          echo "install: $(( (end - start) / 1000000 )) ms"

      # The version comes out of the installed package, never a literal: the
      # binaries are keyed to it, and a key carrying a number somebody typed is
      # a key that goes on hitting after a bump and serves the wrong browser.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "playwright: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A THIRD CACHE CATEGORY, and the reason it is allowed where `dist/` is
      # not. The rule beside the store cache above is that build OUTPUT is never
      # cached: `tsc -b` decides what to rebuild from `.tsbuildinfo`, a restored
      # `dist/` can carry orphans from a branch where a source was deleted, and
      # the whole prize was measured at ~2.5 s against a 13.6 s runner-to-runner
      # spread. None of that applies to a browser binary. It is a downloaded
      # TOOL, like the pnpm store — immutable, addressed by version, and unable
      # to make a build wrong by being stale, because a stale one is a different
      # version and Playwright refuses to launch it.
      #
      # The key carries the runner OS for the reason the store's does — one
      # lockfile installs 397 packages on Linux and 398 on macOS — and the
      # Playwright version rather than the lockfile hash, so an unrelated
      # dependency bump does not throw away 200 MB of download.
      #
      # NO RESTORE-KEY, which IS the difference from the store cache. A partial
      # store is a correct store that installs the rest; a browser directory
      # restored from a different Playwright version is a directory that LOOKS
      # populated and holds the wrong build. `actions/cache` reports both a
      # restore-key hit and a total miss as `cache-hit: false`, so there would
      # be no way to tell them apart here. Exact key or nothing.
      #
      # TO BUST THIS CACHE BY HAND: bump `v1` in the key below.
      - name: Cache the browser binary
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-v1-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # `--only-shell`, which is ~199 MB against 554 MB for `install chromium`
      # (three artefacts: Chrome for Testing 356 MB, the headless shell 196 MB
      # and FFmpeg 2.5 MB) and 1.1 GB for the bare default over five
      # directories. Those are Task 1.13.1's macOS figures and the ones printed
      # below are this runner's; they are not the same builds.
      #
      # It is not a downgrade to something the local suite has never run. Task
      # 1.13.2 read the process table while a headless browser was open and a
      # headless `chromium.launch()` spawns `chrome-headless-shell` — so the
      # ~199 MB artefact is the binary a green local run already used. The
      # obvious way of checking gets that backwards:
      # `chromium.executablePath()` reports the 356 MB Chrome for Testing
      # binary for the same launch. Read the process, not the path. The mirror
      # of it is why the local install is the full 554 MB: `--only-shell`
      # cannot serve `pnpm e2e --headed`, and CI never runs headed.
      #
      # THIS STEP RUNS ON A CACHE HIT TOO, deliberately. It is idempotent and it
      # PRINTS what it did, which is the only thing that separates a restored
      # cache from a silent re-download — `cache-hit` cannot, because a
      # version mismatch inside a restored directory is invisible to it.
      #
      # Nothing here is fetched by `pnpm install`: Playwright ships no install
      # script anywhere in its chain (read out of the published tarballs in Task
      # 1.13.1, not inferred from a green install), which is why `allowBuilds`
      # still has its single `esbuild` entry and why the browser download is an
      # explicit command that can be cached, skipped and measured on its own.
      - name: Install the browser
        run: |
          set -euo pipefail
          echo "browser cache-hit (exact key): ${{ steps.browser-cache.outputs.cache-hit }}"
          start=$(date +%s%N)
          pnpm exec playwright install --only-shell chromium
          end=$(date +%s%N)
          echo "browser install: $(( (end - start) / 1000000 )) ms"
          echo
          echo "what is on disk:"
          du -sh ~/.cache/ms-playwright 2>/dev/null || true
          du -sh ~/.cache/ms-playwright/* 2>/dev/null || true

      # BY NAME, and it has to come first for a reason that presents as a bug:
      # `pnpm e2e` resolves BOTH addresses from the backend's BUILT
      # `dist/config.js`, so on an unbuilt tree it exits 1 with "run `pnpm build`
      # first" before a browser ever starts. `pnpm verify` orders this locally;
      # a workflow orders nothing for free.
      - name: Build
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          pnpm build
          end=$(date +%s%N)
          echo "build: $(( (end - start) / 1000000 )) ms"

      # `pnpm dev` BY NAME — the same three watchers a developer runs, not a
      # CI-shaped pair assembled here. This is the largest single thing this job
      # does that `pnpm e2e` deliberately does not do for itself, and the
      # argument for that split is in e2e/playwright.config.ts: Playwright's own
      # `webServer` judges readiness by ONE URL, and Task 1.8.4 measured that a
      # busy 3000 leaves `pnpm dev` running and looking entirely healthy with
      # nothing exiting non-zero — so a frontend probe passes against half a
      # system, and the backend is the half this suite watches.
      #
      # Nothing here polls a port or sleeps. `pnpm e2e` gates on
      # `scripts/check-ready.mjs` ITSELF, which judges both halves, waits out a
      # startup and names which one is wrong — so the readiness rule is not
      # written down a second time in this file, and a CI failure to start reads
      # in the same words a developer already knows.
      - name: Start the pair
        run: |
          set -euo pipefail
          nohup pnpm dev > "${RUNNER_TEMP}/dev.log" 2>&1 &
          echo "DEV_PID=$!" >> "$GITHUB_ENV"
          echo "started \`pnpm dev\` as pid $!; readiness is \`pnpm e2e\`'s to judge"
        env:
          PORT: "0"

      # ALL TEN JOURNEYS, INCLUDING THE ONE-MINUTE RECOVERY ONE, and that is a
      # decision rather than a consequence of running everything.
      # `--grep-invert "recovers on the next poll"` is the lever and it is not
      # pulled: that journey waits out TWO real 30 s poll intervals and is the
      # only thing in the repository that asserts the interval the application
      # actually polls at, that a failure does not clear the surviving
      # timestamp, and that recovery happens without a page reload. Skipping it
      # would leave the story's recovery criterion asserted on a laptop and not
      # in CI, which is a thing ADR 0013 would then have to say. It costs about
      # a minute of a job that already spends more than that installing, and the
      # other nine run underneath it — though that arithmetic is worker-count
      # dependent, so read the worker line the reporter prints rather than
      # carrying a local total.
      - name: Browser journeys
        run: |
          set -euo pipefail
          start=$(date +%s%N)
          status=0
          pnpm e2e || status=$?
          echo "e2e: $(( ($(date +%s%N) - start) / 1000000 )) ms"
          exit $status

      # The pair's own log, on failure only. It is the answer to the failure
      # this job can produce that a laptop cannot: the suite never started
      # because half the pair did not come up, in which case there are no
      # Playwright artefacts at all and this is the only evidence there is.
      - name: The pair's log
        if: failure()
        run: |
          echo "::group::pnpm dev"
          cat "${RUNNER_TEMP}/dev.log" || true
          echo "::endgroup::"

      # ON FAILURE ONLY, and the reason is a measurement rather than a
      # principle: a green run leaves a 96-byte `.last-run.json` and one failed
      # test leaves ~450 KB — a 318,749 B trace zip, a 121,570 B screenshot and
      # an 11,318 B page snapshot (Task 1.13.2, locally). Video is `off` and no
      # HTML reporter is enabled, so there is no `playwright-report/` to
      # collect. Traces are the largest thing this repository would upload and
      # they are worth exactly nothing on a green run.
      #
      # 7 days, for the reason the coverage reports get 7: a trace is opened
      # within days of the run that produced it or it is not opened at all. Read
      # one with `pnpm exec playwright show-trace <path>`.
      #
      # `if-no-files-found: warn` rather than `error`, unlike the coverage
      # upload: this step runs on failures that produce no artefacts at all,
      # and turning "the pair never started" into a second red step names the
      # wrong thing.
      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/test-results
            ${{ runner.temp }}/dev.log
          if-no-files-found: warn
          retention-days: 7

      # Best effort, and it does not gate anything: the runner is torn down
      # after this either way. It exists so a `pnpm dev` left running cannot
      # hold the job open waiting on a process that never exits.
      - name: Stop the pair
        if: always()
        run: kill "${DEV_PID:-0}" 2>/dev/null || true
