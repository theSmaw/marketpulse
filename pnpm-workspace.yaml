packages:
  - "apps/*"
  - "packages/*"
  # The browser suite (Task 1.13.2). A fourth workspace package, and the only
  # one matched by a literal rather than a glob — `e2e` is neither an app nor a
  # library, so filing it under `apps/*` would put a thing we never deploy into
  # the directory that means "a thing we deploy", and `packages/*` means "a
  # thing the apps import".
  #
  # Task 1.13.1 measured what this line costs: the package joins **every**
  # `pnpm -r` fan-out the moment it matches — `pnpm test`, `pnpm coverage` and
  # `pnpm test:process` all report "Scope: 4 of 5 workspace projects" — and the
  # only thing keeping the browser suite out of the fast suite is that `e2e`
  # has no `test` script. Nothing checks that it stays absent. See
  # `e2e/package.json`, which says the same thing beside the scripts it does
  # have, because a `package.json` cannot hold a comment.
  - "e2e"

# Dependencies may not run install scripts unless they are named here, and an
# un-allowlisted one fails the install outright rather than warning. That policy
# has been in place since Task 1.1.1 and stayed empty until Task 1.4.5.
#
# `esbuild` is the first and only entry. Storybook 10 depends on it directly —
# there is still no esbuild in the Vite toolchain itself, because Vite 8 is the
# Rolldown release and lists esbuild only as an optional peer. Installing
# Storybook produced exactly the failure Task 1.4.1's spike recorded:
#
#   [ERR_PNPM_IGNORED_BUILDS] Ignored build scripts: esbuild@0.28.2
#
# with `pnpm install` at exit 1, and pnpm rewriting this file with an
# `esbuild: set this to true or false` stub. esbuild's install script fetches
# and unpacks the platform binary it cannot ship in one package, so it genuinely
# needs to run; the alternative is a broken binary, not a safer install.
#
# When this fires again, allowlist the specific package and say why here. Never
# widen the policy.
allowBuilds:
  esbuild: true

# Refuse to install under a Node version outside the range in package.json's
# `engines`, rather than printing a warning and carrying on. Keeps local and CI
# on the version recorded in .nvmrc.
engineStrict: true
